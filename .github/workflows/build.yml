---
name: build-kitten

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions: {}

env:
  IMAGE_NAME: almalinux-bootc
  IMAGE_REGISTRY: ghcr.io
  IMAGE_OWNER: daedalusys

jobs:
  set-versions-matrix:
    name: Set versions matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          echo 'matrix=["10-kitten"]' >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.VERSION_MAJOR }} ${{ matrix.ARCH }}
    needs: [set-versions-matrix]
    runs-on: ${{ matrix.ARCH == 'arm64' && 'ubuntu-24.04-arm'
        || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        VERSION_MAJOR: ${{ fromJSON(
            needs.set-versions-matrix.outputs.matrix) }}
        ARCH: [amd64, arm64]
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      PLATFORM: linux/${{ matrix.ARCH }}
      VERSION_MAJOR: ${{ matrix.VERSION_MAJOR }}
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          submodules: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Build image
        run: |
          set -euxo pipefail
          sudo podman build \
            --platform="${PLATFORM}" \
            --security-opt=label=disable \
            --cap-add=all \
            --device /dev/fuse \
            --manifest localhost/${IMAGE_NAME}:${VERSION_MAJOR} \
            -f ${VERSION_MAJOR}/Containerfile \
            .

      - name: Rechunk
        run: |
          set -euxo pipefail
          sudo podman run --rm --privileged \
            --security-opt=label=disable \
            -v /var/lib/containers:/var/lib/containers:z \
            quay.io/centos-bootc/centos-bootc:stream10 \
            /usr/libexec/bootc-base-imagectl rechunk \
            localhost/${IMAGE_NAME}:${VERSION_MAJOR} \
            localhost/${IMAGE_NAME}:${VERSION_MAJOR}-rechunked
          sudo podman tag \
            localhost/${IMAGE_NAME}:${VERSION_MAJOR}-rechunked \
            localhost/${IMAGE_NAME}:${VERSION_MAJOR}
          sudo podman rmi \
            localhost/${IMAGE_NAME}:${VERSION_MAJOR}-rechunked

      - name: Login to ghcr.io
        if: github.event_name != 'schedule'
        uses: docker/login-action@d3b9cdfa580156c018ca5e745c1bf653d8ea46b5
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push per-arch image
        if: github.event_name != 'schedule'
        env:
          ARCH: ${{ matrix.ARCH }}
        run: |
          set -euxo pipefail
          IMAGE_DEST="${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          sudo podman push \
            --digestfile=/tmp/digest-${VERSION_MAJOR}-${ARCH} \
            "localhost/${IMAGE_NAME}:${VERSION_MAJOR}" \
            "docker://${IMAGE_DEST}:${VERSION_MAJOR}-${ARCH}"

  sign-and-manifest:
    name: Sign + manifest
    needs: [set-versions-matrix, build]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        VERSION_MAJOR: ${{ fromJSON(
            needs.set-versions-matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@b9c35392b7c1401bcc77d30c9b07cf4b1c7a7b07

      - name: Install podman
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Fetch digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: /tmp/digest-*
          retention-days: 1

      - name: Login to ghcr.io
        uses: docker/login-action@d3b9cdfa580156c018ca5e745c1bf653d8ea46b5
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign per-arch with cosign
        env:
          VERSION_MAJOR: ${{ matrix.VERSION_MAJOR }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euxo pipefail
          IMAGE_DEST="${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          for arch in amd64 arm64; do
            digest=$(cat /tmp/digest-${VERSION_MAJOR}-${arch})
            cosign sign --yes "${IMAGE_DEST}@${digest}"
          done

      - name: Create + push manifest list
        env:
          VERSION_MAJOR: ${{ matrix.VERSION_MAJOR }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euxo pipefail
          IMAGE_DEST="${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          sudo podman manifest create "${IMAGE_DEST}:${VERSION_MAJOR}"
          for arch in amd64 arm64; do
            digest=$(cat /tmp/digest-${VERSION_MAJOR}-${arch})
            sudo podman manifest add \
              "${IMAGE_DEST}:${VERSION_MAJOR}" \
              "${IMAGE_DEST}@${digest}" \
              --arch "$arch"
          done
          sudo podman manifest push \
            --all=false \
            --digestfile=/tmp/manifest-digest-${VERSION_MAJOR} \
            "${IMAGE_DEST}:${VERSION_MAJOR}" \
            "docker://${IMAGE_DEST}:${VERSION_MAJOR}"

      - name: Sign manifest list
        env:
          VERSION_MAJOR: ${{ matrix.VERSION_MAJOR }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euxo pipefail
          IMAGE_DEST="${IMAGE_REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          digest=$(cat /tmp/manifest-digest-${VERSION_MAJOR})
          cosign sign --yes "${IMAGE_DEST}@${digest}"

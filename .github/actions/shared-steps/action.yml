name: "Build and Push"
description: Build and push the image to the container registry

inputs:
  VERSION_MAJOR:
    description: The major version of the image to build (e.g. 9, 10)
    required: true
  DATE_STAMP:
    description: The date stamp used for tagging the image (e.g. 20260403)
    required: true
  IMAGE_REGISTRY:
    description: The container registry to push the image to (e.g. quay.io/almalinuxorg)
    required: true
  REGISTRY_USER:
    description: The username for authenticating with the container registry
    required: true
  REGISTRY_PASSWORD:
    description: The password for authenticating with the container registry
    required: true
  KMS_KEY_ALIAS:
    description: The AWS KMS alias to use for signing
    required: false
  AWS_ROLE_ARN:
    description: The AWS role ARN to assume for signing
    required: false
  AWS_REGION:
    description: The AWS region to use for signing
    required: false

runs:
  using: "composite"
  steps:
    - name: Prepare environment
      shell: bash
      run: |
        echo "VARIANT=--platform ${{ env.PLATFORM }}" >> "$GITHUB_ENV"

        # quay.io/almalinuxorg/almalinux-bootc
        IMAGE_DEST=${{ inputs.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
        echo "IMAGE_DEST=${IMAGE_DEST}" >> "$GITHUB_ENV"

        ARCH=${{ matrix.ARCH }}
        echo "CLEAN_ARCH=${ARCH//\//_}" >> "$GITHUB_ENV"

    # Also creates $HOME/.docker/config.json, which is used by Cosign for authentication.
    - name: Login in to registry
      uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
      with:
        registry: ${{ inputs.IMAGE_REGISTRY }}
        username: ${{ inputs.REGISTRY_USER }}
        password: ${{ inputs.REGISTRY_PASSWORD }}

    - name: Get info
      id: info
      shell: bash
      run: |
        INFO=$(sudo podman run ${{ env.VARIANT }} --quiet --rm quay.io/almalinuxorg/${{ inputs.VERSION_MAJOR }}-base bash -c "dnf upgrade -y almalinux-release && rpm -q almalinux-gpg-keys && cat /etc/os-release" || true)
        echo "$INFO"

        echo "id=$(echo "$INFO" | grep "^ID=" | cut -d'=' -f2 | tr -d '"')" >> $GITHUB_OUTPUT
        echo "version-id=$(echo "$INFO" | grep "^VERSION_ID=" | cut -d'=' -f2 | tr -d '"')" >> $GITHUB_OUTPUT
        echo "long-version=$(echo "$INFO" | grep "^VERSION_ID=" | cut -d'=' -f2 | tr -d '"').${{ inputs.DATE_STAMP }}.0" >> $GITHUB_OUTPUT

    # Ubuntu 26.04 ships the bwrap-userns-restrict AppArmor profile. It applies to /usr/bin/bwrap
    # by path, also inside the build container, and moves everything bwrap starts to a profile
    # without capabilities. rpm-ostree runs the scriptlets of the packages with bwrap, so they can't
    # write to /etc and the build fails with "groupadd.rpmostreesave: cannot open /etc/gshadow".
    # This is the override the bootc project uses in its own CI (bootc-dev/actions#55): it keeps
    # what bwrap starts in the profile of bwrap itself. AppArmor stays enabled, and nothing is
    # done in runners without this profile.
    - name: Allow bwrap to keep its capabilities
      shell: bash
      run: |
        if sudo test -r /etc/apparmor.d/bwrap-userns-restrict &&
           sudo test -r /sys/kernel/security/apparmor/profiles &&
           sudo grep -qx 'bwrap (enforce)' /sys/kernel/security/apparmor/profiles; then
          printf '%s\n' 'priority=100 allow file rwlkm /**,' 'priority=100 allow ix /**,' \
            | sudo tee /etc/apparmor.d/local/bwrap-userns-restrict > /dev/null
          sudo apparmor_parser -Q /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          echo "AppArmor override for bwrap installed"
        else
          echo "The bwrap-userns-restrict AppArmor profile is not enforced in this runner, nothing to do"
        fi

    - name: Build image
      id: build
      shell: bash
      run: |
        BUILD_TIME=$(date -Iseconds)

        # define a multiline variable with heredoc
        LABELS=$(cat <<EOF
        redhat.id=${{ steps.info.outputs.id }}
        redhat.version-id=${{ steps.info.outputs.version-id }}
        version=${{ steps.info.outputs.version-id }}
        release=${{ steps.info.outputs.version-id }}
        build-date=${BUILD_TIME}
        org.opencontainers.image.created=${BUILD_TIME}
        org.opencontainers.image.version=${{ steps.info.outputs.long-version }}
        org.opencontainers.image.source=${{ github.repositoryUrl }}
        org.opencontainers.image.title=${{ env.IMAGE_NAME }}
        org.opencontainers.image.url=${{ github.event.repository.html_url }}
        EOF
        )

        while IFS= read -r label; do
          ALL_LABELS="$ALL_LABELS --label=\"$label\" --annotation=\"$label\""
        done <<< "$LABELS"

        make image \
          PLATFORM=${{ env.PLATFORM }} \
          LABELS="${ALL_LABELS}" \
          IMAGE_NAME=${{ env.IMAGE_NAME }} \
          VERSION_MAJOR=${{ inputs.VERSION_MAJOR }}

        echo "image-id=$(cat /tmp/image-id)" >> $GITHUB_OUTPUT

    - name: rechunk image
      id: rechunk
      shell: bash
      run: |
        make rechunk \
          PLATFORM=${{ env.PLATFORM }} \
          IMAGE_NAME=${{ env.IMAGE_NAME }}

        IMAGE_ID=sha256:$(sudo podman image inspect ${{ env.IMAGE_NAME }} -f "{{.Id}}")

        # A damaged package database still lists every package, but dependency lookups fail, which
        # breaks dnf in this image and in the images built on top of it.
        # podman exits with 125 or more when the container itself fails to run.
        RC=0
        sudo podman run ${{ env.VARIANT }} --rm ${IMAGE_ID} bash -c '
            set -euo pipefail
            rpmdb --verifydb
            BASE_RPMDB=/usr/lib/sysimage/rpm-ostree-base-db
            if [[ -d "${BASE_RPMDB}" ]]; then
                rpmdb --verifydb --dbpath "${BASE_RPMDB}"
            fi' || RC=$?
        if (( RC >= 125 )); then
          echo "::error::Could not check the package database of the rechunked image, the container failed to run"
          exit 1
        elif (( RC != 0 )); then
          echo "::error::The package database of the rechunked image is corrupted"
          exit 1
        fi

        echo "image-id=${IMAGE_ID}" >> $GITHUB_OUTPUT

    - name: Run Image
      id: run
      shell: bash
      env:
        IMAGE_ID: ${{ steps.rechunk.outputs.image-id }}
      run: |
        sudo podman run ${{ env.VARIANT }} --rm -ti ${{ env.IMAGE_ID }} bootc --version

        INFO=$(sudo podman run ${{ env.VARIANT }} --rm ${{ env.IMAGE_ID }} bash -c "rpm -q almalinux-gpg-keys && cat /etc/os-release")
        echo "$INFO"

        echo "id=$(echo "$INFO" | grep "^ID=" | cut -d'=' -f2 | tr -d '"')" >> $GITHUB_OUTPUT
        echo "version-id=$(echo "$INFO" | grep "^VERSION_ID=" | cut -d'=' -f2 | tr -d '"')" >> $GITHUB_OUTPUT
        echo "long-version=$(echo "$INFO" | grep "^VERSION_ID=" | cut -d'=' -f2 | tr -d '"').${{ inputs.DATE_STAMP }}.0" >> $GITHUB_OUTPUT
        echo "vendor=$(echo "$INFO" | grep "^VENDOR_NAME=" | cut -d'=' -f2 | tr -d '"')" >> $GITHUB_OUTPUT

    - name: Push to registry
      id: push
      env:
        IMAGE_ID: ${{ steps.rechunk.outputs.image-id }}
        VERSION: ${{ steps.run.outputs.version-id }}
      shell: bash
      run: |
        # The push fails for unknown reasons sometimes, so we'll retry it a few times
        for i in {1..5}; do
          sudo podman push --digestfile=/tmp/digestfile ${{ env.IMAGE_ID }} \
            docker://${IMAGE_DEST}:${{ env.VERSION }}-${{ inputs.DATE_STAMP }}-${{ env.CLEAN_ARCH }} && break || sleep $((10*i))
        done
        [ -f /tmp/digestfile ] || exit 1
        echo "digest=$(cat /tmp/digestfile)" >> $GITHUB_OUTPUT
        echo "image-ref=${IMAGE_DEST}:${{ env.VERSION }}-${{ inputs.DATE_STAMP }}-${{ env.CLEAN_ARCH }}" >> $GITHUB_OUTPUT
        sudo podman inspect ${{ env.IMAGE_ID }}

    - name: Sign Image
      if: ${{ github.event_name != 'pull_request' }}
      uses: ./.github/actions/sign
      with:
        image-ref: ${{ steps.push.outputs.image-ref }}@${{ steps.push.outputs.digest }}
        KMS_KEY_ALIAS: ${{ inputs.KMS_KEY_ALIAS }}
        AWS_ROLE_ARN: ${{ inputs.AWS_ROLE_ARN }}
        AWS_REGION: ${{ inputs.AWS_REGION }}

    - name: Create Job Outputs
      shell: bash
      run: |
        mkdir -p /tmp/outputs/digests

        jq -n --arg platform "${{ matrix.ARCH }}" \
          --arg major "${{ inputs.VERSION_MAJOR }}" \
          --arg digest "${{ steps.push.outputs.digest }}" \
          --arg id "${{ steps.run.outputs.id }}" \
          --arg version "${{ steps.run.outputs.version-id }}" \
          --arg long_version "${{ steps.run.outputs.long-version }}" \
          --arg vendor "${{ steps.run.outputs.vendor }}" \
          --arg image_id "${{ steps.rechunk.outputs.image-id }}" \
          '{($platform): {digest: $digest, id: $id, version: $version, major: $major, long_version: $long_version, vendor: $vendor, image_id: $image_id}}' \
          > /tmp/outputs/digests/${{ env.IMAGE_NAME }}_${{ matrix.VERSION_MAJOR }}_${{ env.CLEAN_ARCH }}.json

        cat /tmp/outputs/digests/${{ env.IMAGE_NAME }}_${{ matrix.VERSION_MAJOR }}_${{ env.CLEAN_ARCH }}.json

    - name: Upload Output Artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ env.IMAGE_NAME }}_${{ matrix.VERSION_MAJOR }}_${{ env.CLEAN_ARCH }}
        retention-days: 1
        if-no-files-found: error
        path: |
          /tmp/outputs/digests/*.json
